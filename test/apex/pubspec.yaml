name: apex_timing_gates
description: APEX Timing Gates - Athletic Performance System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3

  # Navigation
  go_router: ^13.2.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # BLE (mock for now, real later)
  flutter_blue_plus: ^1.31.6

  # Utilities
  uuid: ^4.3.3
  intl: ^0.19.0
  equatable: ^2.0.5

  # File & Share
  file_picker: ^8.0.3
  share_plus: ^9.0.0
  path_provider: ^2.1.2

  # Audio & Haptics
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
